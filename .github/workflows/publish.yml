# Publica no GitHub Pages o dashboard gerado no repositório privado CalderanPH/football-scout-dashboard.
# Fonte: dist/scouting.html da branch main (arquivo único, já com dados, CSS e JS embutidos).
# Requer o secret SOURCE_REPO_TOKEN: token "classic" com escopo `repo` de uma conta com acesso de leitura ao repositório.
name: Publicar dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # a cada hora; só publica se o dashboard mudou

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_REPO: CalderanPH/football-scout-dashboard
  SOURCE_FILE: dist/scouting.html
  SITE_URL: https://matheus-mileski.github.io/golden-phoenix-scouts/

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o dashboard do main
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Secret SOURCE_REPO_TOKEN não configurado."; exit 1; }
          mkdir -p site
          gh api "repos/$SOURCE_REPO/contents/$SOURCE_FILE?ref=main" -H "Accept: application/vnd.github.raw" > site/index.html
          # Confere que é o dashboard antes de publicar
          test "$(wc -c < site/index.html)" -gt 100000
          grep -q 'window.SCOUT_DATA' site/index.html
          grep -q 'window.SCOUT_FILM' site/index.html

      - name: Comparar com o site publicado
        id: diff
        run: |
          if curl -fsSL "$SITE_URL" -o current.html && cmp -s current.html site/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Site já está atualizado."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deploy
        uses: actions/deploy-pages@v4
